<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>团队管理 · 关注优先控制台（方向C）</title>
<style>
  :root {
    --v3-bg: #f8fafc;
    --v3-shell-bg: #f6f8fb;
    --v3-card: #ffffff;
    --v3-card-soft: #f7f8fa;
    --v3-card-inner: #fafbfc;
    --v3-ink: #0b0d12;
    --v3-ink-2: #4d586b;
    --v3-ink-3: #6d7580;
    --v3-line: #eef1f4;
    --v3-line-strong: #dfe4ea;
    --v3-brand: #2f5fff;
    --v3-brand-deep: #2348e0;
    --v3-brand-soft: #e9efff;
    --v3-info: #0094b7;
    --v3-info-text: #00617d;
    --v3-info-soft: #def8fe;
    --v3-ok: #009a60;
    --v3-ok-text: #006639;
    --v3-ok-soft: #e3f9ec;
    --v3-warn: #bb6900;
    --v3-warn-text: #7f3f00;
    --v3-warn-soft: #ffefdf;
    --v3-danger: #d14647;
    --v3-danger-text: #8a2f2d;
    --v3-danger-soft: #ffece9;
    --v3-artifact: #9565c7;
    --v3-artifact-text: #633d89;
    --v3-artifact-soft: #f7eeff;
    --v3-mute: #64748b;
    --v3-mute-text: #4d586b;
    --v3-mute-soft: #eef1f4;
    --v3-r-card: 22px;
    --v3-r-inner: 14px;
    --v3-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 12px 30px rgba(16,24,40,0.055);
    --v3-shadow-pop: 0 10px 44px rgba(16,24,40,0.12);
    --font-sans: 'Inter', system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background:
      radial-gradient(1200px 600px at 82% -12%, rgba(47,95,255,0.06), transparent 60%),
      radial-gradient(900px 520px at -4% 0%, rgba(149,101,199,0.05), transparent 55%),
      var(--v3-shell-bg);
    color: var(--v3-ink);
    -webkit-font-smoothing: antialiased;
    font-size: 14px; line-height: 1.5;
  }
  .page { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--v3-card); border-right: 1px solid var(--v3-line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--v3-brand); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; }
  .brand-name { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
  .nav-section { margin-top: 12px; }
  .nav-label { font-size: 11px; font-weight: 600; color: var(--v3-ink-3); padding: 8px 10px 6px; letter-spacing: 0.04em; text-transform: uppercase; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--v3-ink-2); font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .nav-item:hover { background: var(--v3-card-soft); color: var(--v3-ink); }
  .nav-item.active { background: var(--v3-brand-soft); color: var(--v3-brand-deep); font-weight: 600; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-item .count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--v3-ink-3); font-variant-numeric: tabular-nums; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 60px; border-bottom: 1px solid var(--v3-line); background: rgba(255,255,255,0.72); backdrop-filter: blur(20px); display: flex; align-items: center; gap: 16px; padding: 0 28px; position: sticky; top: 0; z-index: 20; }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--v3-ink-3); }
  .crumb b { color: var(--v3-ink); font-weight: 700; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; white-space: nowrap; }
  .btn svg { width: 15px; height: 15px; }
  .btn-primary { background: var(--v3-brand); color: #fff; }
  .btn-primary:hover { background: var(--v3-brand-deep); }
  .btn-ghost { background: transparent; color: var(--v3-ink-2); }
  .btn-ghost:hover { background: var(--v3-card-soft); color: var(--v3-ink); }
  .btn-icon { width: 34px; padding: 0; justify-content: center; }

  .content { padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1640px; width: 100%; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .page-head h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .page-head p { margin: 4px 0 0; font-size: 13px; color: var(--v3-ink-2); }

  /* signature 三栏 hero */
  .signature { display: grid; grid-template-columns: 240px 1fr 300px; gap: 14px; }
  .sig-card { background: var(--v3-card); border: 1px solid var(--v3-line); border-radius: var(--v3-r-card); box-shadow: var(--v3-shadow); padding: 18px 20px; }
  .sig-hero { background: linear-gradient(135deg, var(--v3-brand-soft), #f3f6ff); border-color: rgba(47,95,255,0.2); display: flex; flex-direction: column; justify-content: center; }
  .sig-hero .big { font-size: 44px; font-weight: 800; color: var(--v3-brand-deep); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .sig-hero .cap { font-size: 12.5px; font-weight: 600; color: var(--v3-ink-2); margin-top: 8px; }
  .sig-hero .sub { font-size: 12px; color: var(--v3-ink-3); margin-top: 2px; }

  .sig-dist h3, .sig-attn h3 { margin: 0 0 12px; font-size: 12px; font-weight: 800; color: var(--v3-ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .dist-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--v3-line); }
  .dist-bar span { display: block; height: 100%; }
  .dist-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 11.5px; color: var(--v3-ink-2); }
  .dist-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dist-legend .sw { width: 10px; height: 10px; border-radius: 3px; }

  .sig-attn { background: var(--v3-danger-soft); border-color: rgba(209,70,71,0.22); }
  .sig-attn h3 { color: var(--v3-danger-text); }
  .attn-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(209,70,71,0.16); }
  .attn-row:last-child { border-bottom: none; }
  .attn-row .a-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--v3-danger-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attn-row .a-meta { font-size: 11px; font-weight: 600; color: var(--v3-danger-text); flex-shrink: 0; }
  .attn-link { font-size: 12px; font-weight: 700; color: var(--v3-danger-text); cursor: pointer; margin-top: 10px; display: inline-flex; align-items: center; gap: 4px; }

  /* 工具栏 */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search { flex: 1 1 320px; min-width: 200px; position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--v3-ink-3); }
  .search input { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--v3-line-strong); background: var(--v3-card); padding: 0 12px 0 36px; font-family: inherit; font-size: 13px; color: var(--v3-ink); outline: none; transition: all .15s; box-shadow: var(--v3-shadow); }
  .search input::placeholder { color: var(--v3-ink-3); }
  .search input:focus { border-color: var(--v3-brand); box-shadow: 0 0 0 3px rgba(47,95,255,0.12); }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--v3-line-strong); background: var(--v3-card); font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--v3-ink-2); cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: var(--v3-brand); color: var(--v3-ink); }
  .chip.active { background: var(--v3-brand-soft); border-color: var(--v3-brand); color: var(--v3-brand-deep); }
  .chip .cnt { font-size: 11px; color: var(--v3-ink-3); font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip.active .cnt { color: var(--v3-brand); }

  /* 关注横条 */
  .attn-strip { background: var(--v3-card); border: 1px solid var(--v3-line); border-left: 3px solid var(--v3-danger); border-radius: var(--v3-r-inner); box-shadow: var(--v3-shadow); padding: 14px 16px; }
  .attn-strip-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .attn-strip-head h3 { margin: 0; font-size: 13px; font-weight: 800; color: var(--v3-danger-text); display: inline-flex; align-items: center; gap: 7px; }
  .attn-strip-head .cnt { font-size: 11px; font-weight: 700; color: #fff; background: var(--v3-danger); padding: 1px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .attn-strip-head .right { margin-left: auto; font-size: 12px; color: var(--v3-ink-3); }
  .strip-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .mini-card { background: var(--v3-card-inner); border: 1px solid var(--v3-line); border-radius: var(--v3-r-inner); padding: 12px; cursor: pointer; transition: all .15s; }
  .mini-card:hover { border-color: var(--v3-brand); box-shadow: var(--v3-shadow); transform: translateY(-1px); }
  .mini-card .mc-top { display: flex; align-items: center; gap: 8px; }
  .mini-card .mc-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; border: 1px solid var(--v3-line); }
  .mini-card .mc-ico svg { width: 16px; height: 16px; }
  .mini-card .mc-name { font-size: 13px; font-weight: 700; color: var(--v3-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-card .mc-meta { font-size: 11.5px; color: var(--v3-ink-2); margin-top: 8px; display: flex; align-items: center; justify-content: space-between; }
  .mini-card .mc-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

  /* 团队玻璃卡（沿用现有 TeamCard） */
  .team-card {
    position: relative; display: flex; flex-direction: column;
    min-height: 260px; background: rgba(255,255,255,0.78);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(47,95,255,0.12);
    border-radius: var(--v3-r-card); box-shadow: var(--v3-shadow);
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    overflow: hidden;
  }
  .team-card:hover { transform: translateY(-2px); box-shadow: var(--v3-shadow-pop); border-color: rgba(47,95,255,0.24); }
  .tc-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 0; }
  .tc-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; border: 1px solid var(--v3-line); }
  .tc-icon svg { width: 21px; height: 21px; }
  .tc-icon.tone-brand { background: var(--v3-brand-soft); color: var(--v3-brand-deep); border-color: rgba(47,95,255,0.18); }
  .tc-icon.tone-info { background: var(--v3-info-soft); color: var(--v3-info-text); border-color: rgba(0,148,183,0.18); }
  .tc-icon.tone-ok { background: var(--v3-ok-soft); color: var(--v3-ok-text); border-color: rgba(0,154,96,0.18); }
  .tc-icon.tone-violet { background: var(--v3-artifact-soft); color: var(--v3-artifact-text); border-color: rgba(149,101,199,0.18); }
  .tc-icon.tone-neutral { background: var(--v3-mute-soft); color: var(--v3-mute-text); border-color: var(--v3-line-strong); }
  .tc-title { flex: 1; min-width: 0; }
  .tc-title .name { font-size: 16px; font-weight: 800; color: var(--v3-ink); line-height: 1.25; letter-spacing: -0.01em; }
  .tc-title .sub { font-size: 12px; color: var(--v3-ink-2); margin-top: 3px; }
  .tc-level { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--v3-ink-3); background: var(--v3-mute-soft); padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .tc-owner { display: flex; align-items: center; gap: 12px; padding: 12px 20px 0; }
  .tc-avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .tc-owner .o-name { font-size: 13.5px; font-weight: 600; color: var(--v3-ink); }
  .tc-owner .o-role { font-size: 11.5px; color: var(--v3-ink-2); margin-top: 1px; }
  .tc-rep { margin-top: auto; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 7px; }
  .tc-rep-head { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--v3-ink-2); }
  .tc-avatars { display: flex; align-items: center; }
  .tc-avatars .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 700; border: 2px solid rgba(255,255,255,0.92); margin-left: -8px; position: relative; }
  .tc-avatars .av:first-child { margin-left: 0; }
  .tc-avatars .av .ai { position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); background: var(--v3-brand); color: #fff; font-size: 8px; font-weight: 800; padding: 0 3px; border-radius: 3px; border: 1px solid #fff; line-height: 1.3; }
  .tc-avatars .more { margin-left: 8px; font-size: 12.5px; font-weight: 600; color: var(--v3-ink-2); }
  .tc-foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; padding: 13px 20px; border-top: 1px solid rgba(47,95,255,0.10); background: var(--v3-brand-soft); font-size: 13px; font-weight: 800; color: var(--v3-brand-deep); cursor: pointer; transition: background .15s; }
  .tc-foot:hover { background: #dde7ff; }
  .tc-foot svg { width: 16px; height: 16px; transition: transform .3s; }
  .team-card:hover .tc-foot svg { transform: translateX(3px); }

  .legend { display: flex; align-items: center; gap: 16px; font-size: 11.5px; color: var(--v3-ink-3); padding: 4px 4px 2px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .bar { width: 12px; height: 3px; border-radius: 2px; }

  @media (max-width: 1280px) { .grid { grid-template-columns: repeat(2, 1fr); } .strip-cards { grid-template-columns: repeat(3, 1fr); } .signature { grid-template-columns: 200px 1fr; } .sig-attn { grid-column: 1 / -1; } }
  @media (max-width: 760px) { .sidebar { display: none; } .content { padding: 16px; } .grid { grid-template-columns: 1fr; } .strip-cards { grid-template-columns: 1fr 1fr; } .signature { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">ST</div><div class="brand-name">SuperTeam</div></div>
    <div class="nav-section">
      <div class="nav-label">控制台</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>项目</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>数字员工</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/><path d="M9 21h6"/><path d="M12 17v4"/><rect x="5" y="7" width="14" height="10" rx="1"/></svg>流程编排</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>技能市场</div>
      <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>团队管理 <span class="count">9</span></div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>收件箱 <span class="count">3</span></div>
    </div>
    <div class="nav-section">
      <div class="nav-label">治理</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>审计流水</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>审批中心</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb">控制台 / <b>团队管理</b></div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-icon" title="刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
      </div>
    </header>

    <div class="content">
      <div class="page-head">
        <div>
          <h1>团队管理</h1>
          <p>先看清需要关注的，再处理日常 · 共 9 个团队</p>
        </div>
        <button class="btn btn-primary" onclick="alert('跳转新建团队页')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>新建团队</button>
      </div>

      <!-- signature 三栏 hero -->
      <div class="signature">
        <div class="sig-card sig-hero">
          <div class="big">9</div>
          <div class="cap">团队总数</div>
          <div class="sub">59 位数字员工 · 46 名成员</div>
        </div>
        <div class="sig-card sig-dist">
          <h3>治理分布</h3>
          <div class="dist-bar">
            <span style="width:44.4%;background:var(--v3-ok)" title="治理生效 4"></span>
            <span style="width:22.2%;background:var(--v3-warn)" title="需更新 2"></span>
            <span style="width:11.1%;background:var(--v3-info)" title="草案待批 1"></span>
            <span style="width:22.2%;background:var(--v3-mute)" title="未配置 2"></span>
          </div>
          <div class="dist-legend">
            <span><span class="sw" style="background:var(--v3-ok)"></span>治理生效 4</span>
            <span><span class="sw" style="background:var(--v3-warn)"></span>需更新 2</span>
            <span><span class="sw" style="background:var(--v3-info)"></span>草案待批 1</span>
            <span><span class="sw" style="background:var(--v3-mute)"></span>未配置 2</span>
          </div>
        </div>
        <div class="sig-card sig-attn">
          <h3>待处理事项</h3>
          <div class="attn-row"><span class="a-name">算法平台组</span><span class="a-meta">2 草案</span></div>
          <div class="attn-row"><span class="a-name">基础设施组</span><span class="a-meta">已禁用</span></div>
          <div class="attn-link" onclick="document.getElementById('attn-strip').scrollIntoView({behavior:'smooth'})">查看全部 5 项待办 →</div>
        </div>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" placeholder="搜索团队名称、slug、负责人…" oninput="applyFilter()" id="search" />
        </div>
        <div class="chips">
          <button class="chip active" data-status="all" onclick="setChip(this,'status')">全部 <span class="cnt">9</span></button>
          <button class="chip" data-status="active" onclick="setChip(this,'status')">活跃 <span class="cnt">7</span></button>
          <button class="chip" data-gov="draft_pending" onclick="setChip(this,'gov')">草案待批 <span class="cnt">1</span></button>
          <button class="chip" data-gov="needs_update" onclick="setChip(this,'gov')">需更新 <span class="cnt">2</span></button>
          <button class="chip" data-gov="not_configured" onclick="setChip(this,'gov')">未配置 <span class="cnt">2</span></button>
        </div>
      </div>

      <!-- 关注横条 -->
      <div class="attn-strip" id="attn-strip">
        <div class="attn-strip-head">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>需要关注 <span class="cnt" id="strip-cnt">5</span></h3>
          <span class="right">治理待办 / 非活跃团队优先置顶</span>
        </div>
        <div class="strip-cards" id="strip-cards"></div>
      </div>

      <!-- 全量卡片网格 -->
      <div class="grid" id="grid"></div>

      <div class="legend">
        <span><span class="bar" style="background:var(--v3-brand)"></span>团队层级 L1–L9</span>
        <span><span class="bar" style="background:var(--v3-ok)"></span>治理生效</span>
        <span><span class="bar" style="background:var(--v3-warn)"></span>需更新</span>
        <span><span class="bar" style="background:var(--v3-danger)"></span>待处理</span>
      </div>
    </div>
  </main>
</div>

<script>
  const teams = [
    { id:1, name:"研发效能组", slug:"rd-efficiency", status:"active", gov:"active", deCount:12, memCount:8, capCount:5, pending:0, risk:"低", owner:{name:"张明", init:"张", color:"#2f5fff"}, rep:[{n:"CR",c:"#2f5fff"},{n:"TG",c:"#0094b7"},{n:"LV",c:"#009a60"},{n:"WY",c:"#9565c7"},{n:"ZS",c:"#bb6900"},{n:"HB",c:"#d14647"}], icon:"rocket", tone:"brand" },
    { id:2, name:"算法平台组", slug:"algo-platform", status:"active", gov:"needs_update", deCount:9, memCount:6, capCount:4, pending:2, risk:"中", owner:{name:"李薇", init:"李", color:"#0094b7"}, rep:[{n:"AP",c:"#0094b7"},{n:"MD",c:"#2f5fff"},{n:"FT",c:"#009a60"},{n:"RK",c:"#9565c7"},{n:"QN",c:"#bb6900"}], icon:"cpu", tone:"info" },
    { id:3, name:"数据基建组", slug:"data-infra", status:"active", gov:"draft_pending", deCount:7, memCount:5, capCount:3, pending:1, risk:"低", owner:{name:"王浩", init:"王", color:"#009a60"}, rep:[{n:"DI",c:"#009a60"},{n:"PQ",c:"#2f5fff"},{n:"SY",c:"#0094b7"},{n:"ET",c:"#9565c7"}], icon:"database", tone:"ok" },
    { id:4, name:"安全合规组", slug:"security-compliance", status:"active", gov:"active", deCount:5, memCount:4, capCount:6, pending:0, risk:"低", owner:{name:"陈静", init:"陈", color:"#d14647"}, rep:[{n:"SC",c:"#d14647"},{n:"AU",c:"#2f5fff"},{n:"VA",c:"#bb6900"},{n:"KM",c:"#0094b7"}], icon:"shield", tone:"violet" },
    { id:5, name:"增长策略组", slug:"growth-strategy", status:"active", gov:"not_configured", deCount:4, memCount:3, capCount:2, pending:0, risk:"中", owner:{name:"刘洋", init:"刘", color:"#9565c7"}, rep:[{n:"GR",c:"#9565c7"},{n:"AB",c:"#2f5fff"},{n:"CM",c:"#0094b7"}], icon:"trending-up", tone:"neutral" },
    { id:6, name:"客户成功组", slug:"customer-success", status:"active", gov:"active", deCount:6, memCount:7, capCount:3, pending:0, risk:"低", owner:{name:"赵琳", init:"赵", color:"#bb6900"}, rep:[{n:"CS",c:"#bb6900"},{n:"SU",c:"#009a60"},{n:"ON",c:"#2f5fff"},{n:"TI",c:"#0094b7"},{n:"RT",c:"#9565c7"}], icon:"users", tone:"brand" },
    { id:7, name:"基础设施组", slug:"infra-core", status:"disabled", gov:"needs_update", deCount:8, memCount:5, capCount:4, pending:1, risk:"高", owner:{name:"孙强", init:"孙", color:"#64748b"}, rep:[{n:"IC",c:"#64748b"},{n:"KP",c:"#2f5fff"},{n:"VM",c:"#0094b7"},{n:"CI",c:"#009a60"},{n:"OB",c:"#d14647"}], icon:"server", tone:"neutral" },
    { id:8, name:"实验创新组", slug:"lab-innovation", status:"archived", gov:"not_configured", deCount:3, memCount:2, capCount:1, pending:0, risk:"低", owner:{name:"周凯", init:"周", color:"#64748b"}, rep:[{n:"LB",c:"#64748b"},{n:"EX",c:"#9565c7"},{n:"ID",c:"#2f5fff"}], icon:"flask", tone:"neutral" },
    { id:9, name:"质量保障组", slug:"qa-assurance", status:"active", gov:"active", deCount:5, memCount:6, capCount:5, pending:0, risk:"低", owner:{name:"吴芳", init:"吴", color:"#009a60"}, rep:[{n:"QA",c:"#009a60"},{n:"TS",c:"#2f5fff"},{n:"RG",c:"#bb6900"},{n:"AU",c:"#0094b7"}], icon:"check-circle", tone:"ok" },
  ];

  const icons = {
    rocket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>',
    cpu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>',
    database:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>',
    shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    "trending-up":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
    users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    server:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>',
    flask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.5L5 19a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 19l-5-9.5V3"/></svg>',
    "check-circle":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  };
  const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

  function stripPill(t) {
    if (t.gov==="needs_update") return { cls:"warn", txt:"需更新", c:"var(--v3-warn-soft)", tc:"var(--v3-warn-text)" };
    if (t.gov==="draft_pending") return { cls:"info", txt:"草案待批", c:"var(--v3-info-soft)", tc:"var(--v3-info-text)" };
    if (t.gov==="not_configured") return { cls:"mute", txt:"未配置", c:"var(--v3-mute-soft)", tc:"var(--v3-mute-text)" };
    if (t.status==="disabled") return { cls:"danger", txt:"已禁用", c:"var(--v3-danger-soft)", tc:"var(--v3-danger-text)" };
    return { cls:"mute", txt:"已归档", c:"var(--v3-mute-soft)", tc:"var(--v3-mute-text)" };
  }
  function isAttn(t) { return t.gov!=="active" || t.status!=="active"; }

  const state = { status:"all", gov:null, q:"" };

  function cardHTML(t, idx) {
    const repHTML = t.rep.slice(0,6).map(r=>`<div class="av" style="background:${r.c}">${r.n}<span class="ai">AI</span></div>`).join('');
    const overflow = t.deCount - t.rep.length;
    const moreHTML = overflow>0 ? `<span class="more">+${overflow}</span>` : '';
    return `<div class="team-card">
      <div class="tc-head">
        <div class="tc-icon tone-${t.tone}">${icons[t.icon]}</div>
        <div class="tc-title">
          <div class="name">${t.name}</div>
          <div class="sub">${t.deCount} 位数字员工 · ${t.slug}</div>
        </div>
        <div class="tc-level">L${idx+1}</div>
      </div>
      <div class="tc-owner">
        <div class="tc-avatar" style="background:${t.owner.color}">${t.owner.init}</div>
        <div><div class="o-name">${t.owner.name}</div><div class="o-role">团队负责人</div></div>
      </div>
      <div class="tc-rep">
        <div class="tc-rep-head"><span>代表成员</span><span>显示 ${t.rep.length} / ${t.deCount}</span></div>
        <div class="tc-avatars">${repHTML}${moreHTML}</div>
      </div>
      <div class="tc-foot" onclick="alert('进入 ${t.name} 详情')">查看完整部门 ${chevron}</div>
    </div>`;
  }

  function miniHTML(t) {
    const p = stripPill(t);
    const meta = t.status!=="active" ? (t.status==="disabled"?"已禁用":"已归档") : (t.pending>0?`${t.pending} 草案`:"待治理");
    return `<div class="mini-card" onclick="alert('进入 ${t.name} 详情')">
      <div class="mc-top">
        <div class="mc-ico tone-${t.tone}" style="background:var(--v3-card-soft)">${icons[t.icon]}</div>
        <div class="mc-name">${t.name}</div>
      </div>
      <div class="mc-meta"><span>${t.deCount} 位 agent</span><span class="mc-pill" style="background:${p.c};color:${p.tc}">${p.txt}</span></div>
    </div>`;
  }

  function render() {
    const match = t =>
      (state.status==="all" || t.status===state.status) &&
      (!state.gov || t.gov===state.gov) &&
      (!state.q || t.name.includes(state.q) || t.slug.includes(state.q) || t.owner.name.includes(state.q));

    const all = teams.filter(match);
    const attn = all.filter(isAttn);
    document.getElementById('strip-cnt').textContent = attn.length;
    document.getElementById('strip-cards').innerHTML = attn.map(miniHTML).join('');
    document.getElementById('grid').innerHTML = all.length
      ? all.map((t,i)=>cardHTML(t, teams.indexOf(t))).join('')
      : '<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--v3-ink-3);">无匹配团队</div>';
  }

  function setChip(btn, kind) {
    if (kind==='status') {
      btn.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      state.status = btn.dataset.status || 'all';
    } else {
      const wasActive = btn.classList.contains('active');
      btn.parentElement.querySelectorAll('[data-gov]').forEach(c=>c.classList.remove('active'));
      state.gov = wasActive ? null : btn.dataset.gov;
      if (!wasActive) btn.classList.add('active');
    }
    render();
  }
  function applyFilter() { state.q = document.getElementById('search').value.trim(); render(); }

  render();
</script>
</body>
</html>
