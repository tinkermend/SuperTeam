<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>收件箱 · 决策工作台原型</title>
    <style>
      :root {
        --bg: #f5f5f2;
        --shell: #eeeee9;
        --card: #fffefa;
        --card-soft: #f4f3ef;
        --card-inner: #fbfaf7;
        --ink: #151515;
        --ink-2: #3d414a;
        --ink-3: #727683;
        --line: #e6e2da;
        --line-strong: #d7d1c8;
        --brand: #4057ff;
        --brand-deep: #2737c7;
        --brand-ink: #1f2878;
        --brand-soft: #eef1ff;
        --brand-wash: #f6f7ff;
        --info: #0094b7;
        --info-text: #00617d;
        --info-soft: #def8fe;
        --ok: #009a60;
        --ok-text: #006639;
        --ok-soft: #e3f9ec;
        --warn: #b87520;
        --warn-text: #6e4716;
        --warn-soft: #fbf7ee;
        --danger: #be4a42;
        --danger-text: #823631;
        --danger-soft: #fbf5f2;
        --artifact: #675c90;
        --artifact-text: #4e456f;
        --artifact-soft: #f1eef8;
        --mute: #6c7280;
        --mute-text: #565b66;
        --mute-soft: #f1f1ee;
        --tag-bg: rgba(255, 255, 255, 0.72);
        --tag-border: #dfe4ec;
        --tag-text: #242a33;
        --tag-muted-dot: #8b93a1;
        --button: #fffdf8;
        --button-hover: #ffffff;
        --selection: #f4f6ff;
        --focus: rgba(64, 87, 255, 0.14);
        --r-card: 22px;
        --r-inner: 14px;
        --r-control: 12px;
        --shadow: 0 1px 2px rgba(28, 25, 18, 0.045), 0 18px 42px rgba(28, 25, 18, 0.075);
        --shadow-hover: 0 2px 4px rgba(28, 25, 18, 0.06), 0 22px 54px rgba(39, 42, 56, 0.11);
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --sans: "Geist", "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        background:
          linear-gradient(180deg, rgba(255, 254, 250, 0.86), rgba(255, 254, 250, 0) 300px),
          radial-gradient(circle at 8% 0%, rgba(64, 87, 255, 0.05), transparent 300px),
          radial-gradient(circle at 92% 12%, rgba(190, 74, 66, 0.032), transparent 330px),
          linear-gradient(135deg, #f5f5f2 0%, #f1f1ec 48%, #faf9f5 100%);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.18;
        background-image:
          linear-gradient(rgba(31, 40, 120, 0.026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(31, 40, 120, 0.022) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(180deg, black, transparent 82%);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0.04;
        background-image:
          radial-gradient(circle at 20% 30%, #000 0 1px, transparent 1px),
          radial-gradient(circle at 70% 80%, #000 0 1px, transparent 1px);
        background-size: 5px 5px, 7px 7px;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .prototype {
        position: relative;
        z-index: 3;
        display: grid;
        grid-template-columns: 246px minmax(0, 1fr);
        height: 100dvh;
        min-height: 100dvh;
      }

      .side-shell {
        position: sticky;
        top: 0;
        height: 100dvh;
        padding: 18px 14px;
      }

      .side {
        display: flex;
        height: 100%;
        flex-direction: column;
        border: 1px solid rgba(95, 88, 72, 0.18);
        border-radius: 26px;
        background: linear-gradient(180deg, rgba(255, 254, 250, 0.88), rgba(247, 246, 241, 0.94));
        box-shadow: var(--shadow);
        padding: 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 10px 16px;
      }

      .brand-mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, #6f81ff, var(--brand) 54%, #2630a8);
        box-shadow: 0 14px 30px rgba(39, 55, 199, 0.26);
        color: #fff;
        font-size: 18px;
        font-weight: 850;
      }

      .brand-name {
        font-size: 16px;
        font-weight: 820;
        letter-spacing: 0;
      }

      .brand-caption {
        color: var(--ink-3);
        font-size: 11px;
        font-weight: 650;
      }

      .nav-group {
        margin-top: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .nav-label {
        margin: 0 10px 8px;
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 780;
        letter-spacing: 0.08em;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 0 10px;
        border-radius: 13px;
        color: var(--ink-2);
        font-weight: 720;
        transition:
          transform 420ms var(--ease),
          background 420ms var(--ease),
          color 420ms var(--ease);
      }

      .nav-item svg {
        width: 18px;
        height: 18px;
        stroke-width: 1.6;
      }

      .nav-item:hover {
        background: var(--card);
        color: var(--ink);
        transform: translateX(2px);
      }

      .nav-item.active {
        background: linear-gradient(180deg, #f7f8ff, #eef1ff);
        color: var(--brand-ink);
        box-shadow: inset 0 0 0 1px rgba(64, 87, 255, 0.16);
      }

      .nav-badge {
        margin-left: auto;
        border-radius: 8px;
        background: #ffffff;
        color: var(--brand-ink);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 850;
        padding: 2px 7px;
      }

      .side-footer {
        margin-top: auto;
        border-radius: 18px;
        background: var(--card);
        box-shadow: inset 0 0 0 1px var(--line);
        padding: 14px;
      }

      .side-footer strong {
        display: block;
        font-size: 12px;
        line-height: 1.3;
      }

      .side-footer span {
        display: block;
        margin-top: 4px;
        color: var(--ink-3);
        font-size: 11px;
      }

      .workspace {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 10px;
        min-width: 0;
        height: 100dvh;
        overflow: hidden;
        padding: 16px 22px 18px 0;
      }

      .topbar {
        position: sticky;
        top: 14px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 16px;
        width: calc(100% - 24px);
        min-height: 52px;
        margin: 0;
        border: 1px solid rgba(95, 88, 72, 0.18);
        border-radius: 24px;
        background: rgba(255, 254, 250, 0.8);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px) saturate(1.2);
        padding: 7px 10px 7px 18px;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-3);
        font-size: 12px;
        font-weight: 700;
      }

      .breadcrumb svg {
        width: 16px;
        height: 16px;
        stroke-width: 1.7;
      }

      .topbar-title {
        color: var(--ink);
        font-weight: 820;
      }

      .command {
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(540px, 42vw);
        height: 40px;
        margin-left: auto;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: var(--button);
        padding: 0 12px;
        color: var(--ink-3);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .command svg {
        width: 17px;
        height: 17px;
        stroke-width: 1.7;
      }

      .command input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 13px;
      }

      .keycap {
        border-radius: 7px;
        background: var(--card-soft);
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 760;
        padding: 2px 6px;
      }

      .avatar {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, #222326, #101114);
        color: #fff;
        font-size: 12px;
        font-weight: 850;
      }

      .page {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
        width: calc(100% - 24px);
      }

      .filters {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        margin: 0 0 8px;
        flex-wrap: wrap;
      }

      .segmented {
        display: inline-flex;
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--card-soft);
        padding: 4px;
      }

      .segmented button,
      .chip,
      .density button {
        border: 0;
        border-radius: 11px;
        background: transparent;
        color: var(--ink-2);
        font-weight: 760;
        padding: 7px 11px;
        transition:
          transform 420ms var(--ease),
          background 420ms var(--ease),
          color 420ms var(--ease),
          box-shadow 420ms var(--ease);
      }

      .segmented button:hover,
      .chip:hover,
      .density button:hover {
        transform: translateY(-1px);
      }

      .segmented button.active,
      .density button.active {
        background: var(--card);
        color: var(--brand-ink);
        box-shadow: 0 10px 24px rgba(39, 55, 199, 0.1), inset 0 0 0 1px rgba(64, 87, 255, 0.12);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        background: var(--button);
        color: var(--ink-2);
        box-shadow: var(--shadow);
      }

      .chip svg {
        width: 16px;
        height: 16px;
        stroke-width: 1.7;
      }

      .density {
        display: inline-flex;
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--card-soft);
        padding: 4px;
      }

      .console {
        display: grid;
        grid-template-columns: minmax(310px, 0.82fr) minmax(460px, 1.12fr) minmax(286px, 0.7fr);
        gap: 12px;
        align-items: stretch;
        height: 100%;
        min-height: 0;
      }

      .panel {
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: var(--shadow);
        padding: 6px;
        min-height: 0;
      }

      .panel-core {
        height: 100%;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 22px;
        background: var(--card);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.84);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 54px;
        border-bottom: 1px solid var(--line);
        background: var(--card-soft);
        padding: 0 16px;
      }

      .panel-title {
        font-size: 13px;
        font-weight: 850;
      }

      .panel-meta {
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 760;
      }

      .queue {
        height: calc(100% - 54px);
        overflow-y: auto;
        background: var(--card);
      }

      .queue-row {
        position: relative;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: var(--card);
        text-align: left;
        padding: 12px 14px;
        transition:
          transform 420ms var(--ease),
          background 420ms var(--ease),
          box-shadow 420ms var(--ease);
      }

      .queue-row::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        background: var(--line-strong);
      }

      .queue-row[data-risk="blocked"]::before,
      .queue-row[data-risk="high"]::before {
        background: var(--danger);
      }

      .queue-row[data-risk="medium"]::before {
        background: var(--warn);
      }

      .queue-row:hover {
        z-index: 1;
        background: var(--card-inner);
        box-shadow: 0 12px 24px rgba(28, 25, 18, 0.08);
        transform: translateY(-1px);
      }

      .queue-row.active {
        background: var(--selection);
        box-shadow: inset 3px 0 0 var(--brand), inset 0 0 0 1px rgba(64, 87, 255, 0.08);
      }

      .icon-tile {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 12px;
        background: var(--mute-soft);
        color: var(--mute-text);
      }

      .icon-tile svg {
        width: 17px;
        height: 17px;
        stroke-width: 1.7;
      }

      .queue-row[data-risk="blocked"] .icon-tile,
      .queue-row[data-risk="high"] .icon-tile {
        background: var(--danger-soft);
        color: var(--danger-text);
      }

      .queue-row[data-risk="medium"] .icon-tile {
        background: var(--warn-soft);
        color: var(--warn-text);
      }

      .queue-titleline {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        flex-wrap: wrap;
      }

      .queue-title {
        min-width: 0;
        color: var(--ink);
        font-size: 13px;
        font-weight: 830;
        line-height: 1.38;
      }

      .queue-row.active .queue-title {
        color: var(--ink);
      }

      .queue-summary {
        display: -webkit-box;
        margin: 4px 0 0;
        overflow: hidden;
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.5;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .queue-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 7px;
        color: var(--ink-3);
        font-size: 11px;
        flex-wrap: wrap;
      }

      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 22px;
        border: 1px solid transparent;
        border-radius: 8px;
        font-size: 10.5px;
        font-weight: 820;
        line-height: 1;
        padding: 0 8px;
        white-space: nowrap;
      }

      .pill::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: currentColor;
      }

      .pill.brand {
        background: var(--brand-soft);
        border-color: rgba(64, 87, 255, 0.14);
        color: var(--brand-ink);
      }

      .pill.info {
        background: var(--tag-bg);
        border-color: var(--tag-border);
        color: var(--tag-text);
      }

      .pill.ok {
        background: var(--tag-bg);
        border-color: var(--tag-border);
        color: var(--tag-text);
      }

      .pill.ok::before {
        color: var(--ok);
      }

      .pill.warn {
        background: var(--tag-bg);
        border-color: var(--tag-border);
        color: var(--tag-text);
      }

      .pill.warn::before {
        color: var(--warn);
      }

      .pill.danger {
        background: var(--tag-bg);
        border-color: var(--tag-border);
        color: var(--tag-text);
      }

      .pill.danger::before {
        color: var(--danger);
      }

      .pill.artifact {
        background: var(--tag-bg);
        border-color: var(--tag-border);
        color: var(--tag-text);
      }

      .pill.mute {
        background: var(--tag-bg);
        border-color: var(--tag-border);
        color: var(--tag-text);
      }

      .pill.mute::before,
      .pill.info::before,
      .pill.artifact::before {
        color: var(--tag-muted-dot);
      }

      .pill.no-dot::before {
        display: none;
      }

      .detail {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100%;
        min-height: 0;
      }

      .detail-hero {
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(64, 87, 255, 0.038), transparent 34%),
          var(--card);
        padding: 14px 18px 12px;
      }

      .detail-kicker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 820;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail h2 {
        margin: 7px 0 9px;
        font-size: clamp(19px, 1.55vw, 24px);
        font-weight: 880;
        letter-spacing: 0;
        line-height: 1.16;
        text-wrap: balance;
      }

      .detail-pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .detail-body {
        min-height: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
        gap: 10px;
        padding: 12px 14px 14px;
      }

      .detail-section {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card-inner);
        padding: 10px;
      }

      .detail-section:last-child {
        border-bottom: 1px solid var(--line);
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 7px;
        font-size: 12px;
        font-weight: 860;
      }

      .section-title span {
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 760;
      }

      .summary-box {
        border-radius: 16px;
        background: var(--card);
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.48;
        padding: 9px 10px;
      }

      .context-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .context-item {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        align-items: start;
        gap: 8px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--card);
        padding: 7px 9px;
      }

      .context-label {
        color: var(--ink-3);
        font-size: 10.5px;
        font-weight: 730;
      }

      .context-value {
        color: var(--ink);
        font-size: 11px;
        font-weight: 780;
        overflow-wrap: anywhere;
      }

      .evidence-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        min-width: 0;
      }

      .evidence {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 7px;
        transition:
          transform 420ms var(--ease),
          border 420ms var(--ease),
          background 420ms var(--ease);
      }

      .evidence:hover {
        border-color: rgba(64, 87, 255, 0.26);
        background: var(--card);
        transform: translateY(-1px);
      }

      .evidence-icon {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 10px;
        background: var(--mute-soft);
        color: var(--mute-text);
        flex: 0 0 auto;
      }

      .evidence-icon svg {
        width: 13px;
        height: 13px;
        stroke-width: 1.65;
      }

      .evidence strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 11px;
        font-weight: 810;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .evidence span {
        display: block;
        margin-top: 2px;
        min-width: 0;
        overflow: hidden;
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .timeline-item {
        position: relative;
        display: flex;
        min-width: 0;
        flex-direction: row;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 8px;
      }

      .timeline-dot {
        display: grid;
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 9px;
        background: var(--card);
        box-shadow: inset 0 0 0 2px var(--line-strong);
        color: var(--ink-3);
      }

      .timeline-dot svg {
        width: 11px;
        height: 11px;
        stroke-width: 1.7;
      }

      .timeline-item.done .timeline-dot {
        background: var(--ok-soft);
        box-shadow: inset 0 0 0 2px var(--ok);
        color: var(--ok-text);
      }

      .timeline-item.current .timeline-dot {
        background: var(--brand);

        approval: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 12l2 2 4-5"/><path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7z"/></svg>',
        project_decision: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v4"/><path d="M5 8l3 3"/><path d="M19 8l-3 3"/><path d="M8 21h8"/><path d="M9 17h6"/><path d="M12 7a5 5 0 0 0-3 9h6a5 5 0 0 0-3-9z"/></svg>',
        arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>',
      };

      let selectedId = items[0].id;
      const queue = document.getElementById("queue");
      const detail = document.getElementById("detail");
      const actions = document.getElementById("actions");
      const quickLinks = document.getElementById("quickLinks");
      const audit = document.getElementById("audit");
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function showToast(message) {
        toastText.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function renderQueue() {
        queue.innerHTML = items
          .map((item) => {
            const active = item.id === selectedId ? " active" : "";
            return `
              <button class="queue-row${active}" data-id="${item.id}" data-risk="${item.risk}" data-type="${item.type}" type="button">
                <span class="icon-tile">${icons[item.type]}</span>
                <span>
                  <span class="queue-titleline">
                    <span class="queue-title">${escapeHtml(item.title)}</span>
                    <span class="pill ${item.riskTone}">${escapeHtml(item.riskLabel)}</span>
                  </span>
                  <span class="queue-summary">${escapeHtml(item.summary)}</span>
                  <span class="queue-meta">
                    <span class="pill ${item.type === "approval" ? "info" : "artifact"} no-dot">${escapeHtml(item.typeLabel)}</span>
                    <span class="mono">${escapeHtml(item.sourceId)}</span>
                    <span>${escapeHtml(item.node)}</span>
                    <span class="mono">${escapeHtml(item.last)}</span>
                  </span>
                </span>
              </button>
            `;
          })
          .join("");

        queue.querySelectorAll(".queue-row").forEach((row) => {
          row.addEventListener("click", () => {
            selectedId = row.dataset.id;
            renderAll();
          });
        });
      }

      function renderDetail(item) {
        detail.innerHTML = `
          <div class="detail-hero">
            <div class="detail-kicker">
              <span>${escapeHtml(item.id)} · ${escapeHtml(item.source)}</span>
              <span>${escapeHtml(item.wait)}</span>
            </div>
            <h2>${escapeHtml(item.title)}</h2>
            <div class="detail-pills">
              <span class="pill ${item.type === "approval" ? "info" : "artifact"}">${escapeHtml(item.typeLabel)}</span>
              <span class="pill ${item.riskTone}">${escapeHtml(item.riskLabel)}</span>
              <span class="pill brand">等待人工判断</span>
            </div>
          </div>

          <div class="detail-body">
            <section class="detail-section">
              <h3 class="section-title">为什么需要处理 <span>reason</span></h3>
              <div class="summary-box">${escapeHtml(item.summary)}</div>
            </section>

            <section class="detail-section">
              <h3 class="section-title">上下文切片 <span>context{}</span></h3>
              <div class="context-grid">
                ${item.context
                  .map(
                    ([label, value]) => `
                      <div class="context-item">
                        <div class="context-label">${escapeHtml(label)}</div>
                        <div class="context-value ${String(value).includes("_") || String(value).includes("·") ? "mono" : ""}">${escapeHtml(value)}</div>
                      </div>
                    `,
                  )
                  .join("")}
              </div>
            </section>

            <section class="detail-section">
              <h3 class="section-title">证据与工件 <span>deep_link{}</span></h3>
              <div class="evidence-grid">
                ${item.evidence
                  .map(
                    ([label, meta]) => `
                      <div class="evidence">
                        <span class="evidence-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></span>
                        <span style="min-width:0">
                          <strong>${escapeHtml(label)}</strong>
                          <span>${escapeHtml(meta)}</span>
                        </span>
                      </div>
                    `,
                  )
                  .join("")}
              </div>
            </section>

            <section class="detail-section">
              <h3 class="section-title">过程记录 <span>timeline</span></h3>
              <div class="timeline">
                <div class="timeline-item done">
                  <span class="timeline-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 12 4 4L19 6"/></svg></span>
                  <span>
                    <span class="timeline-title">数字员工完成执行并提交结果</span>
                    <span class="timeline-desc">结果已写入控制平面，等待人类负责人确认后推进。</span>
                    <span class="timeline-time">${escapeHtml(item.last)}</span>
                  </span>
                </div>
                <div class="timeline-item current">
                  <span class="timeline-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg></span>
                  <span>
                    <span class="timeline-title">${escapeHtml(item.node)}</span>
                    <span class="timeline-desc">动作会回写 inbox item，并同步源对象状态。</span>
                    <span class="timeline-time">当前节点</span>
                  </span>
                </div>
                <div class="timeline-item">
                  <span class="timeline-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
                  <span>
                    <span class="timeline-title">协调线程继续分派下一步</span>
                    <span class="timeline-desc">通过后，Temporal 协调线程会接收 signal 并串行处理下一步。</span>
                    <span class="timeline-time">等待决策结果</span>
                  </span>
                </div>
              </div>
            </section>
          </div>
        `;
      }

      function renderActions(item) {
        actions.innerHTML = item.actions
          .map((action, index) => {
            const toneClass = action.tone === "primary" ? " primary" : action.tone === "danger" ? " danger" : action.tone === "warn" ? " warn" : "";
            return `
              <button class="action-button${toneClass}" type="button" data-action="${escapeHtml(action.label)}">
                <span>${escapeHtml(action.label)}</span>
                <span class="action-orb">${icons.arrow}</span>
              </button>
            `;
          })
          .join("");

        actions.querySelectorAll(".action-button").forEach((button) => {
          button.addEventListener("click", () => showToast(`已选择「${button.dataset.action}」，真实落地时会打开确认对话框。`));
        });

        quickLinks.innerHTML = [
          ["查看项目", item.project],
          ["查看源对象", item.sourceId],
          ["打开任务", item.task],
        ]
          .map(
            ([label, value]) => `
              <a class="quick-link" href="#" data-value="${escapeHtml(value)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                <span>${escapeHtml(label)}</span>
                <span class="mono">${escapeHtml(value)}</span>
                <span class="arrow">${icons.arrow}</span>
              </a>
            `,
          )
          .join("");

        quickLinks.querySelectorAll(".quick-link").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            showToast(`原型跳转：${link.dataset.value}`);
          });
        });

        audit.innerHTML = `
          <div class="audit">
            <span class="audit-dot"></span>
            <span><strong>事项创建</strong><span>${escapeHtml(item.source)} · ${escapeHtml(item.sourceId)}</span></span>
          </div>
          <div class="audit current">
            <span class="audit-dot"></span>
            <span><strong>等待 ${escapeHtml(item.owner)} 处理</strong><span>${escapeHtml(item.wait)} · ${escapeHtml(item.node)}</span></span>
          </div>
          <div class="audit">
            <span class="audit-dot"></span>
            <span><strong>动作后写入审计</strong><span>POST /api/v1/inbox/items/{id}/actions</span></span>
          </div>
        `;
      }

      function renderMeta(item) {
        document.querySelector("[data-wait]").textContent = item.wait;
        document.querySelector("[data-sla-ring]").textContent = item.ring;
        document.querySelector("[data-sla-copy]").textContent =
          item.risk === "blocked" ? "该事项阻断后续调度，需要先做判断。" : "超过审批建议时限前仍可处理。";
      }

      function renderAll() {
        const item = items.find((entry) => entry.id === selectedId) || items[0];
        renderQueue();
        renderDetail(item);
        renderActions(item);
        renderMeta(item);
      }

      document.querySelectorAll(".segmented button, .density button").forEach((button) => {
        button.addEventListener("click", () => {
          const group = button.parentElement;
          group.querySelectorAll("button").forEach((entry) => entry.classList.remove("active"));
          button.classList.add("active");
        });
      });

      renderAll();
    </script>
