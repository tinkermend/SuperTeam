<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 C · 链入表（落地视觉）</title>
  <link rel="stylesheet" href="./shared.css" />
  <style>
    .toolbar {
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:14px;
    }
    .surface {
      background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
      box-shadow:var(--shadow); overflow:hidden;
    }
    .table-scroll { overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th {
      text-align:left; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
      color:var(--ink-3); padding:11px 16px; border-bottom:1px solid var(--line-strong);
      background:var(--card-soft); position:sticky; top:0; white-space:nowrap;
    }
    td { padding:14px 16px; border-bottom:1px solid var(--line); vertical-align:middle; background:#fff; }
    tr:last-child td { border-bottom:0; }
    tr:hover td { background:#fafbfd; }
    tr.dim .name, tr.dim .desc { color:var(--ink-2); }
    .name { font-weight:700; color:var(--ink); }
    .desc {
      color:var(--ink-2); font-size:12.5px; margin-top:2px; max-width:28ch;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .actions { display:flex; gap:6px; justify-content:flex-end; }
    .seats { color:var(--ink); font-size:13px; max-width:16ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .deepest { font-size:13px; color:var(--ink); }
    .chain { display:flex; flex-wrap:wrap; align-items:center; gap:4px; max-width:520px; }
    .step {
      display:inline-flex; align-items:center; gap:5px; padding:3px 8px 3px 7px;
      border-radius:8px; background:var(--card-soft); border:1px solid var(--line);
      font-size:12px;
    }
    .step.exit { background:#fff; border-color:#d5def8; }
    .exit-dot {
      width:6px; height:6px; border-radius:50%; background:var(--brand);
      box-shadow:0 0 0 3px var(--brand-soft); flex:none;
    }
    .step-title { font-weight:650; }
    .par {
      display:inline-flex; align-items:center; gap:4px; padding:3px;
      border:1px dashed var(--line-strong); border-radius:10px; background:#fafbfd;
    }
    .par-mark { color:var(--ink-3); font-size:11px; font-weight:700; padding:0 2px; }
    .more { position:relative; }
    .menu {
      position:absolute; right:0; top:36px; min-width:120px; background:#fff;
      border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
      padding:6px; display:none; z-index:2;
    }
    .menu.open { display:grid; }
    .menu button {
      text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:8px;
      font:inherit; cursor:pointer; color:var(--danger);
    }
    .menu button:hover { background:#fde8e9; }
    .legend { display:flex; gap:14px; color:var(--ink-3); font-size:12px; align-items:center; }
    .legend .exit-dot { display:inline-block; }
  </style>
</head>
<body>
  <div class="app">
    <header class="page-head">
      <div>
        <h1>场景模板</h1>
        <p class="sub">声明这类活要经过哪些席位、收到哪一档。新规划只匹配启用中的模板。保存改的是当前配置，这里不记版本。</p>
      </div>
      <a class="btn btn-primary" href="#">+ 新建模板</a>
    </header>
    <div class="toolbar">
      <div class="filters">
        <button class="chip" aria-pressed="true" data-filter="all">全部 6</button>
        <button class="chip" aria-pressed="false" data-filter="active">启用中 4</button>
        <button class="chip" aria-pressed="false" data-filter="disabled">已禁用 2</button>
      </div>
      <p class="legend"><span class="exit-dot"></span> 蓝点 = 可作收口 · ∥ = 并行（只读预览）</p>
    </div>
    <div class="surface">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>模板</th>
              <th>骨架</th>
              <th>最深收口</th>
              <th>状态</th>
              <th>更新</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <p class="hint">
      <b>已按接口校正：</b>可收口不是骨架字段，用蓝点表示 exit↔产物匹配；软件交付按 depends_on 显示并行，不拉直。
      本页只模拟 <code>GET /scenario-templates</code>，不请求 versions / role-view。落地规范见
      <a href="./redesign-spec.md">redesign-spec.md</a>。
    </p>
  </div>
  <script src="./data.js"></script>
  <script>
    let filter = "all";
    const tbody = document.getElementById("tbody");
    function statusLabel(s) { return s === "active" ? "启用中" : "已禁用"; }
    function render() {
      const rows = TEMPLATES.filter(t => filter === "all" || t.status === filter);
      tbody.innerHTML = rows.map(t => `
        <tr class="${t.status === "disabled" ? "dim" : ""}">
          <td>
            <p class="name">${t.name}</p>
            <p class="desc">${t.desc}</p>
            <p class="key" style="margin-top:4px">${t.key}</p>
          </td>
          <td>${chainHtml(t)}</td>
          <td class="deepest">${t.deepest || `<span class="generic">generic</span>`}</td>
          <td><span class="pill ${t.status === "active" ? "pill-ok" : "pill-mute"}"><span class="dot"></span>${statusLabel(t.status)}</span></td>
          <td class="time">${t.updated}</td>
          <td>
            <div class="actions">
              <a class="btn btn-ghost btn-sm" href="#">编辑</a>
              <button class="btn btn-ghost btn-sm">${t.status === "active" ? "停用" : "启用"}</button>
              <div class="more">
                <button class="btn btn-ghost btn-sm" data-more="${t.key}">更多</button>
                <div class="menu" id="menu-${t.key}"><button type="button">删除</button></div>
              </div>
            </div>
          </td>
        </tr>
      `).join("");
      tbody.querySelectorAll("[data-more]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const menu = document.getElementById("menu-" + btn.dataset.more);
          document.querySelectorAll(".menu").forEach(m => { if (m !== menu) m.classList.remove("open"); });
          menu.classList.toggle("open");
        });
      });
    }
    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
        render();
      });
    });
    document.addEventListener("click", () => document.querySelectorAll(".menu").forEach(m => m.classList.remove("open")));
    render();
  </script>
</body>
</html>
