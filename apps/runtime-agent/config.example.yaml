# Runtime Agent 示例配置
# 本地使用时复制为 apps/runtime-agent/config.yaml，并通过 --config 指定。
# 真实 config.yaml 被 Git 忽略，可以放置本机 node_id 和 bootstrap key。
# 环境变量 RUNTIME_AGENT_* 仅作为部署平台或临时运行覆盖层，CLI 参数优先级最高。

runtime:
  # 节点 ID
  node_id: local-dev-node

  # Control Plane API 地址
  control_plane_url: http://localhost:8080

  # Runtime Agent 接入 bootstrap key；启动后由 Control Plane 签发短期 session token
  bootstrap_key: replace-with-bootstrap-key

  # 心跳间隔（秒）
  heartbeat_interval: 30

  # 最大并发任务数
  max_concurrent_tasks: 3

http:
  # Runtime Agent 本地 HTTP/WS 服务监听地址。
  #
  # ⚠ 当前**未接线**：daemon.run() 不 bind 这个地址，`server.rs` 那套本地
  # HTTP 面（/runs 调试端点、/health）只有 tests/http_server_test.rs 在用。
  # 也就是说改这里不会让任何端口监听起来（别再去 lsof 找它）。
  # 真要给运维做 liveness probe 时再把 daemon 接上去；节点存活目前由
  # Control Plane 侧的 heartbeat/session 判定。
  addr: 127.0.0.1:7077

runs:
  # Provider 执行日志和事件落盘目录
  log_dir: .superteam/runtime-runs

workspace:
  # 工作目录基础路径（交付默认与 RUNTIME_AGENT_WORKSPACE_DIR 对齐）
  base_dir: /var/superteam/workspaces

  # 清理策略：on_success | on_completion | manual
  cleanup_policy: on_success

  # 工作目录最大保留数量
  max_retained: 10

providers:
  claude_code:
    enabled: true
    # 命令名或绝对路径；命令名按 PATH 解析。勿写死本机不存在的 /usr/local/bin/...。
    binary_path: claude
    # 超时时间（秒）
    timeout: 3600
  opencode:
    enabled: false
    binary_path: opencode
    timeout: 3600
  codex:
    enabled: false
    binary_path: codex
    timeout: 3600

logging:
  # 日志级别：trace | debug | info | warn | error
  level: info

  # 日志格式：json | pretty
  format: pretty

  # 日志输出：stdout | file
  output: stdout

  # 日志文件路径（当 output = file 时）
  file_path: .superteam/runtime-agent.log
