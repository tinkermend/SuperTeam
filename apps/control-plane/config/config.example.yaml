http:
  addr: ":8081"

postgres:
  url: "postgres://superteam:xxxx@115.190.247.9:35432/superteam?sslmode=disable"

redis:
  url: "redis://:xxxx@115.190.247.9:6379/0"

objectStore:
  # Local MinIO/localstack uses path-style addressing.
  # Volcengine TOS S3 example:
  # endpoint: "https://tos-s3-cn-beijing.volces.com"
  # region: "cn-beijing"
  # forcePathStyle: false
  endpoint: "https://tos-s3-cn-guangzhou.volces.com"
  region: "cn-guangzhou"
  bucket: "superteam"
  accessKeyId: "xxx"
  secretAccessKey: "xxxx"
  forcePathStyle: false

employeeEnv:
  # Digital-employee environment-variable encryption. Comma-separated
  # "keyId:base64(32-byte-key)" entries; activeKeyId selects the key used to
  # encrypt new values (all listed keys can decrypt, to support rotation).
  # Generate a key with:  openssl rand -base64 32
  # Keep config.yaml out of git (it already is). Env overrides:
  #   SUPERTEAM_ENV_ENCRYPTION_KEYS / SUPERTEAM_ENV_ENCRYPTION_ACTIVE_KEY_ID
  keys: "v1:replace-with-base64-32-byte-key"
  activeKeyId: "v1"

temporal:
  enabled: false
  address: "127.0.0.1:7233"
  namespace: "default"
  taskQueue: "superteam-project-coordination"

authz:
  # Default keeps PostgreSQL business tables as the effective permission source.
  # Local OpenFGA shadow trial:
  # engine: "openfga_shadow"
  # openfga:
  #   apiUrl: "http://127.0.0.1:8088"
  #   storeId: "replace-with-openfga-store-id"
  #   modelId: "replace-with-openfga-model-id"
  #   apiToken: ""
  engine: "db"

auth:
  # 开发期可通过配置或环境变量 AUTH_CAPTCHA_ENABLED=false 关闭登录验证码。
  # 默认应保持 true，避免生产环境无意关闭验证码。
  captchaEnabled: true

planner:
  provider: "openai-compatible"
  apiKey: "replace-with-planner-api-key"
  # DeepSeek example:
  # baseURL: "https://api.deepseek.com"
  # model: "deepseek-chat"
  # Qwen example:
  # baseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # model: "qwen-plus"
  baseURL: "https://your-openai-compatible-endpoint"
  model: "your-planner-model"
  maxTokens: 8192
  temperature: 0
  maxAttempts: 2
