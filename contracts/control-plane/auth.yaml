openapi: 3.0.3
info:
  title: SuperTeam Control Plane - Auth API
  version: 1.0.0
  description: 用户认证相关 API

servers:
  - url: http://localhost:8080
    description: 本地开发环境

paths:
  /api/auth/captcha:
    get:
      summary: 创建登录验证码挑战
      operationId: createCaptcha
      tags:
        - Auth
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallengeResponse'
  /api/auth/login:
    post:
      summary: 用户登录
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: admin
                password:
                  type: string
                  format: password
                  minLength: 1
                  example: admin
                captcha_id:
                  type: string
                  format: uuid
                  description: 验证码开启时必填；关闭时可省略
                captcha_code:
                  type: string
                  minLength: 4
                  maxLength: 4
                  description: 验证码开启时必填；关闭时可省略
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session_token=abc123; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me:
    get:
      summary: 获取当前登录用户信息
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      summary: 用户登出
      operationId: logout
      tags:
        - Auth
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 登出成功
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session_token=; Max-Age=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logout success

  /api/auth/login-logs:
    get:
      summary: 查询 Web 控制台登录日志
      operationId: listLoginLogs
      tags:
        - Auth
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: event_type
          in: query
          required: false
          schema:
            type: string
            enum: [login_succeeded, login_failed, logout_succeeded]
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [succeeded, failed]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/operation-logs:
    get:
      summary: 查询 Web 控制台操作日志
      operationId: listOperationLogs
      tags:
        - Auth
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [succeeded, failed]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/account/profile:
    patch:
      summary: 修改当前登录用户资料
      operationId: updateCurrentUserProfile
      tags:
        - Auth
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserProfileRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/account/password:
    post:
      summary: 修改当前登录用户密码
      operationId: changeCurrentUserPassword
      tags:
        - Auth
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCurrentUserPasswordRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/account/login-logs:
    get:
      summary: 查询当前登录用户登录日志
      operationId: listCurrentUserLoginLogs
      tags:
        - Auth
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/users:
    get:
      summary: 查询平台用户列表
      operationId: listUsers
      tags:
        - Auth
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: 按用户名、显示名称或邮箱搜索
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, disabled]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: 创建平台用户
      operationId: createUser
      tags:
        - Auth
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/users/{id}/status:
    patch:
      summary: 启用或禁用平台用户
      operationId: updateUserStatus
      tags:
        - Auth
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/users/{id}/project-team-scopes:
    get:
      summary: 查询用户可选择的项目团队范围
      operationId: listUserProjectTeamScopes
      tags:
        - Auth
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjectTeamScopeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: 替换用户可选择的项目团队范围
      operationId: replaceUserProjectTeamScopes
      tags:
        - Auth
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserProjectTeamScopesRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjectTeamScopeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/users/{id}/reset-password:
    post:
      summary: 重置平台用户密码
      operationId: resetUserPassword
      tags:
        - Auth
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token

  schemas:
    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'

    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'

    CaptchaChallengeResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: 当前登录验证码是否启用
        captcha_id:
          type: string
          format: uuid
          description: 验证码开启时返回
        image_data_url:
          type: string
          description: 验证码开启时返回 PNG data URL
        expires_at:
          type: string
          format: date-time
          description: 验证码开启时返回过期时间

    LoginLogListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoginLogRecord'

    UserListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'

    CreateUserRequest:
      type: object
      required: [username, display_name, password, avatar]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1
        avatar:
          $ref: '#/components/schemas/UserAvatar'
        selectable_team_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 可选。此用户可以管理的团队范围，创建后可在团队管理中修改。

    ReplaceUserProjectTeamScopesRequest:
      type: object
      required: [team_ids]
      properties:
        team_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]

    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1

    UpdateCurrentUserProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        avatar:
          $ref: '#/components/schemas/UserAvatar'

    ChangeCurrentUserPasswordRequest:
      type: object
      required: [current_password, password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    LoginLogRecord:
      type: object
      required: [id, event_type, username, result, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [login_succeeded, login_failed, logout_succeeded]
        user_id:
          type: string
          format: uuid
          nullable: true
        username:
          type: string
        session_id:
          type: string
          format: uuid
          nullable: true
        client_ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        result:
          type: string
          enum: [succeeded, failed]
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    OperationLogListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationLogRecord'

    OperationLogRecord:
      type: object
      required: [id, module, action, result, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        username:
          type: string
          nullable: true
        module:
          type: string
        resource_type:
          type: string
          nullable: true
        resource_id:
          type: string
          nullable: true
        action:
          type: string
        result:
          type: string
          enum: [succeeded, failed]
        request_id:
          type: string
          nullable: true
        client_ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, username, status, avatar]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, disabled]
        avatar:
          $ref: '#/components/schemas/UserAvatar'
        avatar_asset_id:
          type: string
          nullable: true

    UserProjectTeamScopeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserProjectTeamScope'

    UserProjectTeamScope:
      type: object
      required: [id, tenant_id, user_id, team_id, status, created_at, updated_at, team]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        status:
          type: string
        granted_by_user_id:
          type: string
          format: uuid
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        team:
          $ref: '#/components/schemas/UserProjectTeamSummary'

    UserProjectTeamSummary:
      type: object
      required: [id, slug, name, status, digital_employee_count, pending_draft_count, governance_status, risk_summary, human_owners]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
        digital_employee_count:
          type: integer
          format: int32
        current_revision:
          type: integer
          format: int32
          nullable: true
        pending_draft_count:
          type: integer
          format: int32
        governance_status:
          type: string
        risk_summary:
          type: string
        human_owners:
          type: array
          items:
            $ref: '#/components/schemas/UserProjectTeamOwner'

    UserProjectTeamOwner:
      type: object
      required: [id, username, status, avatar]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        status:
          type: string
        avatar:
          $ref: '#/components/schemas/UserAvatar'
        avatar_asset_id:
          type: string
          nullable: true

    UserAvatar:
      type: object
      required: [provider, style, seed]
      properties:
        provider:
          type: string
          enum: [dicebear]
        style:
          type: string
          enum: [adventurer]
        seed:
          type: string
          minLength: 1
          maxLength: 255
        options:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string

  responses:
    BadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或凭据无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 无权限访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
