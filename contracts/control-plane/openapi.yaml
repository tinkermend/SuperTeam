    CreateDigitalEmployeeRequest:
      type: object
      required:
        - employee_type
        - name
        - avatar_asset_id
        - provider_type
      properties:
        team_id:
          type: string
          format: uuid
          nullable: true
          description: Team ID; omit or null for team-less (tenant-level) digital employees.
        employee_type:
          type: string
        name:
          type: string
        avatar_asset_id:
          type: string
        role:
          type: string
        description:
          type: string
        permission_policy:
          type: object
          additionalProperties: true
        risk_level:
          type: string
        persona_memory_markdown:
          type: string
        skills:
          type: array
          items:
            type: string
          description: >-
            Skill slugs from the tenant skill registry to logically bind to
            the employee at creation. Unknown slugs are rejected with 400.
        mcp_servers:
          type: array
          items:
            type: string
          description: >-
            MCP server keys from the tenant MCP registry to logically bind
            to the employee at creation. Unknown keys are rejected with 400.
        capability_bindings:
          type: object
          additionalProperties: true
          description: >-
            Additional capability declarations (external_capabilities,
            environment_variable_refs). The skills and mcp_servers keys are
            deprecated here: when the top-level skills/mcp_servers fields are
            absent they are still read for backward compatibility, but they
            are always stripped from the stored config revision; logical
            bindings are persisted in the binding tables instead.
        budget_policy:
          type: object
          additionalProperties: true
        provider_type:
          type: string
        environment_variables:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: string
              sensitive:
                type: boolean
                default: true
        metadata:
          type: object
          additionalProperties: true
