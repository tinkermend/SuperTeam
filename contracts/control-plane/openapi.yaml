components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuntimeSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectTaskId:
      name: projectTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanRevisionId:
      name: planRevisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderSessionId:
      name: providerSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RuntimeNodeIdHeader:
      name: X-Node-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: Request failed
      content:
        text/plain:
          schema:
            type: string
  schemas:
    SystemConfigItem:
      type: object
      required:
        - key
        - domain
        - label
        - description
        - value_type
        - default_value
        - effective_value
        - is_overridden
        - min_value
        - max_value
      properties:
        key:
          type: string
        domain:
          type: string
          description: Registry domain tag; the console groups tabs by this value.
        label:
          type: string
        description:
          type: string
