  /api/v1/artifacts/{artifactRefId}/content:
    get:
      operationId: getArtifactContent
      summary: Retrieve an artifact's raw content via presigned redirect
      description: >-
        Validates the caller's read access to the artifact's project, then 302
        redirects to a short-lived presigned GET URL. Bytes never pass through
        the control plane. Only retrievable for runtime-uploaded
        content-addressed artifacts (object_ref under the tenant's artifacts/
        prefix).
      parameters:
        - name: artifactRefId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: >-
            默认 302 重定向到 presigned URL;format=json 时改为 200 返回
            presigned URL 本体,供浏览器两步取回(避免 fetch 跨域重定向的
            Origin taint 迫使对象存储 CORS 放行 null origin)。
          schema:
            type: string
            enum:
              - json
      responses:
        "200":
          description: Presigned download location (format=json)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactContentLocation"
        "302":
          description: Redirect to presigned download URL
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
